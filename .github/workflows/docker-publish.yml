name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'landing-app/**'
      - 'models-app/**'
      - '.github/workflows/**'
  workflow_dispatch: # Memungkinkan trigger manual lewat tombol "Run workflow" di GitHub Actions

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert Owner to Lowercase
        id: repo-owner
        run: echo "lowercase=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and Push Backend (models-app)
      - name: Build and Push Backend Image (tpm-model-apps)
        uses: docker/build-push-action@v6
        with:
          context: ./models-app
          file: ./models-app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.lowercase }}/tpm-model-apps:latest
            ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.lowercase }}/tpm-model-apps:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and Push Frontend (landing-app)
      - name: Build and Push Frontend Image (tpm-landing-apps)
        uses: docker/build-push-action@v6
        with:
          context: ./landing-app
          file: ./landing-app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.lowercase }}/tpm-landing-apps:latest
            ${{ env.REGISTRY }}/${{ steps.repo-owner.outputs.lowercase }}/tpm-landing-apps:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
