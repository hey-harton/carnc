services:
  # Backend model API (FastAPI)
  models-app:
    build:
      context: ./models-app
      dockerfile: Dockerfile
    # Optimasi 1: Mengaktifkan 2 workers Uvicorn per kontainer (Total 3 kontainer = 6 worker paralel)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    deploy:
      resources:
        limits:
          # Optimasi 2: Relaksasi batas CPU dan Memory untuk menangani komputasi paralel ML
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.20'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Load Balancer & Gateway (Nginx)
  nginx-lb:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - models-app

  # Frontend UI (React + Vite)
  landing-app:
    build:
      context: ./landing-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - nginx-lb

  # Caching DB (Redis)
  redis-db:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Load Testing (Locust)
  locust:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://nginx-lb
    depends_on:
      - nginx-lb
