events {
    worker_connections 2048;
}

http {
    upstream ml_api_servers {
        server models-app:8000;
        # Optimasi 1: Mengaktifkan persistent keepalive connection antar Nginx & backend
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ml_api_servers;
            
            # Optimasi 2: Menggunakan HTTP/1.1 dan mengosongkan Connection header untuk reuse koneksi
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Optimasi 3: Perpanjang batas timeout agar tidak terjadi drop connection / 504 saat trafik puncak
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
